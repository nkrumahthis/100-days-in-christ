<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 In Christ - 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1 class="site-title">100 Days In Christ</h1>
        </div>
        <div class="header-center">
            <button class="timeline-button" id="timelineButton" aria-label="Jump to day">
                <span class="timeline-label">Day <span id="dayNumber">1</span> of 100</span>
                <svg class="timeline-arc" viewBox="0 0 100 20" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#3d5a80;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#c9a96a;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#4a8a7f;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect class="arc-background" x="0" y="8" width="100" height="4" rx="2"/>
                    <rect class="arc-progress" x="0" y="8" width="1" height="4" rx="2" fill="url(#arcGradient)"/>
                    <circle class="arc-dot" cx="1" cy="10" r="1.5" fill="#c9a96a"/>
                </svg>
            </button>
        </div>
        <button class="menu-button" id="menuToggle" aria-label="Menu">☰</button>
    </header>

    <!-- Day Grid Modal -->
    <div id="dayGrid" class="day-grid-modal">
        <div class="day-grid-content">
            <button class="grid-close" id="gridClose">×</button>
            <div class="grid-sections" id="gridSections"></div>
        </div>
    </div>

    <div id="gridOverlay" class="grid-overlay"></div>

    <main class="content">
        <article class="day-article">
            <h2 id="dayTitle" class="article-title"></h2>

            <section class="article-section">
                <h3 class="section-label">Scripture</h3>
                <div id="mainScripture" class="scripture"></div>
            </section>

            <section class="article-section" id="supportingSection">
                <h3 class="section-label">Supporting</h3>
                <div id="supportingScriptures" class="scripture-list"></div>
            </section>

            <section class="article-section">
                <h3 class="section-label">The Reality</h3>
                <div id="reality" class="reality"></div>
            </section>

            <section class="article-section">
                <h3 class="section-label">Important</h3>
                <div id="important" class="important"></div>
            </section>

            <section class="article-section" id="recommendedSection">
                <h3 class="section-label">Recommended Reading</h3>
                <div id="recommended" class="recommended-reading"></div>
            </section>
        </article>

        <nav class="nav-controls">
            <button id="prevButton" class="nav-btn">← Previous Day</button>
            <button id="nextButton" class="nav-btn">Next Day →</button>
        </nav>
    </main>

    <aside id="menu" class="menu">
        <div class="menu-header">
            <h2>Menu</h2>
            <button id="closeMenu" class="close-btn">×</button>
        </div>
        <div class="menu-content">
            <div class="menu-section">
                <label for="dayInput">Jump to day:</label>
                <input type="number" id="dayInput" min="1" max="100" placeholder="1-100">
            </div>
            <button id="resetButton" class="reset-btn">Reset to Today</button>
        </div>
    </aside>

    <div id="overlay" class="overlay"></div>

    <script src="script.js"></script>
</body>
</html>
